name: Continuous Integration
on: [ push, pull_request ]
jobs:
  build:
    name: Build Plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @elgato/cli@latest validate "Sources\com.morphclue.wakatime.sdPlugin" --no-update-check
      - run: npx --yes @elgato/cli@latest pack "Sources\com.morphclue.wakatime.sdPlugin" --output . --force --no-update-check --no-file-list
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: .\com.morphclue.wakatime.streamDeckPlugin
  release:
    name: Publish Plugin in Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: plugin-artifact
          path: ${{runner.temp}}/artifacts
      - name: Display structure of downloaded files
        run: ls -R
        working-directory: ${{runner.temp}}/artifacts
      - name: Create Release-Draft
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          release_name: Release ${{ github.ref }}
          tag_name: ${{ github.ref }}
          draft: false
      - name: Upload asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ${{runner.temp}}/artifacts/com.morphclue.wakatime.streamDeckPlugin
          asset_name: com.morphclue.wakatime.streamDeckPlugin
          asset_content_type: application/octet-stream
